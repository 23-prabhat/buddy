[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bro"
version = "0.1.0"
description = "Real-time meeting & screen-aware AI assistant with a terminal-style desktop UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bro contributors" }]
keywords = [
  "ai",
  "assistant",
  "meeting",
  "screen",
  "ocr",
  "terminal",
  "pyside6",
  "fastapi",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.28.0",
  "anyio>=4.7.0",
  "structlog>=24.4.0",
  "PySide6>=6.8.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "openai>=1.60.0",
  "Pillow>=11.0.0",
  "pytesseract>=0.3.13",
  "mss>=9.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
]
hotkeys = ["pynput>=1.7.7"]
all = ["bro[dev,hotkeys]"]

[project.urls]
Homepage = "https://github.com/anomalyco/bro"
Documentation = "https://github.com/anomalyco/bro#readme"
Repository = "https://github.com/anomalyco/bro"
Issues = "https://github.com/anomalyco/bro/issues"
Changelog = "https://github.com/anomalyco/bro/blob/main/CHANGELOG.md"

[project.scripts]
bro = "bro.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bro"]

[tool.hatch.build.targets.sdist]
include = [
  "src/bro",
  "tests",
  "docs",
  "scripts",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
  ".env.example",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
pretty = true
packages = ["bro"]
mypy_path = "src"
